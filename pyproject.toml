[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivideoeditor"
version = "0.1.0"
description = "Claude-powered automatic video editor: analyze raw footage, let Claude edit a timeline, render with FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.6",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow>=10",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
separate = ["demucs>=4.0"]
animation = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
ave = "aivideoeditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aivideoeditor = ["webui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
